name: Check TakeFerry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Rehearse from the portable app
        run: |
          python3 scripts/build_release.py "$RUNNER_TEMP/takeferry.pyz"
          python3 "$RUNNER_TEMP/takeferry.pyz" demo --output "$RUNNER_TEMP/door-rehearsal"
          python3 -m zipfile -t "$RUNNER_TEMP/door-rehearsal/rain-at-the-door.zip"
          python3 "$RUNNER_TEMP/takeferry.pyz" demo --canvas-tour --output "$RUNNER_TEMP/canvas-tour"
          python3 "$RUNNER_TEMP/takeferry.pyz" skill --output "$RUNNER_TEMP/takeferry-skill.zip"
          python3 -m zipfile -t "$RUNNER_TEMP/takeferry-skill.zip"
