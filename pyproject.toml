[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "takeferry"
version = "0.1.0a2"
description = "A directing skill and MCP toolkit for screenwriters using Hermes Agent to try the same shot across AI video platforms"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "TakeFerry contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/Tsunami1212/takeferry"
Issues = "https://github.com/Tsunami1212/takeferry/issues"

[project.scripts]
takeferry = "takeferry.__main__:main"

[tool.setuptools]
packages = ["takeferry", "takeferry._skill"]

[tool.setuptools.package-dir]
"takeferry._skill" = "skills/takeferry"

[tool.setuptools.package-data]
takeferry = ["data/rainy-door/*.png", "data/rainy-door/*.mp4", "data/rainy-door/*.json"]
"takeferry._skill" = ["SKILL.md", "LICENSE", "references/*.md", "references/upstream/*.json",
  "references/upstream/*/LICENSE", "references/upstream/*/*/*.md", "references/upstream/*/*/references/*.md"]
